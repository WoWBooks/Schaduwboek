<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Schaduwboek - Hoofdstuk 1</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden; background: #000; font-family: sans-serif;">

    <div id="ui" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; color: white; padding-bottom: 50px;">
        <div id="msg" style="background: rgba(0,0,0,0.6); padding: 15px 25px; border-radius: 30px; pointer-events: auto; margin-bottom: 20px;">Richt je camera op de Hiro-marker</div>
        <button id="playBtn" style="display: none; padding: 15px 40px; font-size: 1.2rem; background: #fff; color: #000; border: none; border-radius: 30px; cursor: pointer; pointer-events: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">▶ Tik om te starten</button>
        <button id="soundBtn" style="display: none; margin-top: 20px; padding: 12px 25px; background: rgba(255,255,255,0.2); color: white; border: 2px solid white; border-radius: 30px; pointer-events: auto; backdrop-filter: blur(5px);">🔊 Zet geluid aan</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <video id="vid" src="V1.mp4" preload="auto" loop="false" playsinline webkit-playsinline crossorigin="anonymous"></video>
        </a-assets>

        <a-marker preset="hiro" id="marker">
            <a-video 
                id="vidscreen"
                src="#vid"
                material="shader: chromakey; color: 0 0 0; threshold: 0.1;"
                width="1.4" 
                height="2.49"
                position="0 0.2 0"
                rotation="-90 0 0"
                visible="false">
            </a-video>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const vid = document.getElementById('vid');
        const screen = document.getElementById('vidscreen');
        const marker = document.getElementById('marker');
        const msg = document.getElementById('msg');
        const playBtn = document.getElementById('playBtn');
        const soundBtn = document.getElementById('soundBtn');

        marker.addEventListener('markerFound', () => {
            msg.style.display = 'none';
            if (vid.paused) playBtn.style.display = 'block';
        });

        marker.addEventListener('markerLost', () => {
            msg.style.display = 'block';
            playBtn.style.display = 'none';
        });

        playBtn.addEventListener('click', () => {
            playBtn.style.display = 'none';
            vid.muted = true;
            vid.play().then(() => {
                screen.setAttribute('visible', 'true');
                soundBtn.style.display = 'block';
            });
        });

        soundBtn.addEventListener('click', () => {
            vid.muted = false;
            soundBtn.style.display = 'none';
        });
    </script>
</body>
</html>
