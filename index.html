<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Activeer Ida's Wereld</title>

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #000; color: #fff; overflow: hidden; }

    canvas { pointer-events: none !important; }
    a-scene { pointer-events: none !important; }

    /* ── LAADSCHERM ── */
    #loading-screen {
      position: fixed; inset: 0; background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 99999; gap: 20px; padding: 30px; text-align: center;
    }
    #loading-screen h1 { font-size: 2rem; font-weight: 700; letter-spacing: 0.1em; }
    #loading-screen p  { font-size: 0.95rem; color: #aaa; line-height: 1.6; max-width: 320px; }
    .spinner { width: 44px; height: 44px; border: 4px solid rgba(255,255,255,0.15); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── HUD (titel bovenin) ── */
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      display: none; align-items: center; justify-content: center;
      padding: 14px 20px; background: rgba(0,0,0,0.5); backdrop-filter: blur(6px);
      z-index: 70000; pointer-events: none;
    }
    #hud.visible { display: flex; }
    #hud-title {
      font-size: 0.85rem; font-weight: 600; color: rgba(255,255,255,0.85);
      letter-spacing: 0.04em;
    }

    /* ── MARKER HINT (onderaan, zichtbaar als marker gezocht wordt) ── */
    #marker-hint {
      position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 24px;
      padding: 10px 24px; font-size: 0.82rem; color: rgba(255,255,255,0.75);
      white-space: nowrap; display: none; z-index: 70000; pointer-events: none;
    }
    #marker-hint.visible { display: block; }

    /* ── TAP OVERLAY ── */
    #tap-overlay {
      position: fixed; inset: 0; z-index: 99998; pointer-events: auto;
      display: none; flex-direction: column; align-items: center;
      justify-content: flex-end; padding-bottom: 80px;
      background: transparent; -webkit-tap-highlight-color: transparent;
      touch-action: manipulation; cursor: pointer;
    }
    #tap-overlay.visible { display: flex; }
    #tap-label {
      background: rgba(255,255,255,0.97); color: #000; border-radius: 30px;
      padding: 16px 36px; font-size: 1.05rem; font-weight: 700;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      pointer-events: none; user-select: none; -webkit-user-select: none;
    }

    /* ── VOLGENDE VIDEO KNOP (verschijnt na afloop video) ── */
    #btn-next {
      display: none;
      position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%);
      z-index: 99000; background: rgba(255,255,255,0.95); color: #000;
      border: none; border-radius: 30px; padding: 14px 32px;
      font-size: 0.95rem; font-weight: 700; pointer-events: auto;
      touch-action: manipulation; cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35); white-space: nowrap;
    }
    #btn-next.visible { display: block; }

    /* ── GELUID KNOP ── */
    #sound-btn {
      display: none; position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
      z-index: 99997; background: rgba(255,255,255,0.95); color: #000;
      border: none; border-radius: 30px; padding: 14px 30px;
      font-size: 1rem; font-weight: 700; pointer-events: auto;
      touch-action: manipulation; cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4); white-space: nowrap;
    }

    /* ── RESET KNOP (klein en discreet, linksboven) ── */
    #btn-reset {
      position: fixed; top: 14px; left: 14px;
      z-index: 99999; background: transparent; color: rgba(255,255,255,0.2);
      border: none; font-size: 0.7rem; padding: 6px 10px;
      cursor: pointer; pointer-events: auto; touch-action: manipulation;
      letter-spacing: 0.03em;
    }

    /* ── EINDE SCHERM ── */
    #end-screen {
      position: fixed; inset: 0; background: rgba(0,0,0,0.93);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 99000; gap: 20px; padding: 40px; text-align: center;
    }
    #end-screen.visible { display: flex; }
    #end-screen h2 { font-size: 1.5rem; font-weight: 700; }
    #end-screen p  { font-size: 0.95rem; color: #aaa; line-height: 1.7; max-width: 300px; }
    #btn-herstart {
      background: #fff; color: #000; border: none; border-radius: 30px;
      padding: 14px 36px; font-size: 1rem; font-weight: 700;
      cursor: pointer; pointer-events: auto; touch-action: manipulation;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    /* ── AR.JS dialogs verbergen ── */
    .a-dialog, .a-dialog-allow-button, .a-dialog-deny-button,
    [class*="a-dialog"], [id*="a-dialog"] {
      display: none !important; visibility: hidden !important;
      pointer-events: none !important; opacity: 0 !important;
    }
  </style>
</head>
<body>

<!-- LAADSCHERM -->
<div id="loading-screen">
  <h1>IDA</h1>
  <div class="spinner"></div>
  <p>Activeer Ida's wereld.<br>Even geduld…</p>
</div>

<!-- HUD: huidige videotitel -->
<div id="hud"><span id="hud-title"></span></div>

<!-- MARKER HINT -->
<div id="marker-hint">Richt je camera op de Hiro-marker</div>

<!-- TAP OVERLAY -->
<div id="tap-overlay">
  <div id="tap-label">▶ Tik om te starten</div>
</div>

<!-- VOLGENDE VIDEO KNOP -->
<button id="btn-next">Volgende video →</button>

<!-- GELUID KNOP -->
<button id="sound-btn">🔊 Zet geluid aan</button>

<!-- RESET KNOP (discreet, linksboven) -->
<button id="btn-reset">opnieuw beginnen</button>

<!-- EINDE SCHERM -->
<div id="end-screen">
  <h2>Je hebt alles gezien</h2>
  <p>Je hebt alle video's van Ida's wereld bekeken.<br>Wil je opnieuw beginnen?</p>
  <button id="btn-herstart">Opnieuw beginnen</button>
</div>

<!-- A-FRAME SCÈNE -->
<a-scene
  id="ar-scene"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
  renderer="logarithmicDepthBuffer: true; colorManagement: true;"
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false"
>
  <a-assets>
    <video
      id="ar-video-asset"
      preload="auto"
      playsinline
      webkit-playsinline
      crossorigin="anonymous"
      loop="false"
    ></video>
  </a-assets>

  <a-marker
    id="hiro-marker"
    preset="hiro"
    smooth="true"
    smoothCount="10"
    smoothTolerance="0.01"
    smoothThreshold="5"
  >
    <a-video
      id="ar-video"
      src="#ar-video-asset"
      width="1.0"
      height="1.78"
      position="0 0.8 0"
      rotation="-90 0 0"
      visible="false"
    ></a-video>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  // ── Videolijst in volgorde ───────────────────────────────
  const VIDEOS = [
    { src: 'intro.mp4',       title: 'Introductie' },
    { src: 'V1.mp4',          title: 'Welkom' },
    { src: 'V2.mp4',          title: 'Hoofd en hart' },
    { src: 'V3.mp4',          title: 'Het verschil tussen je hoofd en je hart' },
    { src: 'V4.mp4',          title: 'Zielafspraken en doelen' },
    { src: 'V5.mp4',          title: 'Zelfliefde en Goddelijke verbinding' },
    { src: 'V6.mp4',          title: 'Tussen twee werelden' },
    { src: 'V7.mp4',          title: 'De prijs van de stilte' },
    { src: 'V8.mp4',          title: 'Veerkracht' },
    { src: 'V9.mp4',          title: 'De kracht van vergeving' },
    { src: 'V10.mp4',         title: 'Spirituele Symbolen' },
    { src: 'Slotwoord.mp4',   title: 'Slotwoord' },
  ];

  const STORAGE_KEY = 'ida_video_index';

  // ── DOM referenties ──────────────────────────────────────
  const loadingScreen = document.getElementById('loading-screen');
  const hud           = document.getElementById('hud');
  const hudTitle      = document.getElementById('hud-title');
  const markerHint    = document.getElementById('marker-hint');
  const tapOverlay    = document.getElementById('tap-overlay');
  const btnNext       = document.getElementById('btn-next');
  const soundBtn      = document.getElementById('sound-btn');
  const btnReset      = document.getElementById('btn-reset');
  const endScreen     = document.getElementById('end-screen');
  const btnHerstart   = document.getElementById('btn-herstart');
  const videoAsset    = document.getElementById('ar-video-asset');
  const arVideoEl     = document.getElementById('ar-video');
  const hiroMarker    = document.getElementById('hiro-marker');

  let videoStarted    = false;
  let markerLostTimer = null;

  // ── Positiebeheer ────────────────────────────────────────
  function getCurrentIndex() {
    const v = parseInt(localStorage.getItem(STORAGE_KEY), 10);
    return isNaN(v) ? 0 : Math.min(v, VIDEOS.length - 1);
  }
  function saveIndex(i) { localStorage.setItem(STORAGE_KEY, i); }
  function resetIndex() { localStorage.removeItem(STORAGE_KEY); }

  // ── Laad huidige video voor ──────────────────────────────
  function prepareCurrentVideo() {
    const idx   = getCurrentIndex();
    const video = VIDEOS[idx];

    videoAsset.pause();
    videoAsset.removeAttribute('src');
    videoAsset.load();
    arVideoEl.setAttribute('visible', 'false');
    videoStarted = false;
    soundBtn.style.display = 'none';
    btnNext.classList.remove('visible');

    videoAsset.src = video.src;
    videoAsset.setAttribute('playsinline', '');
    videoAsset.setAttribute('webkit-playsinline', '');
    videoAsset.load();

    hudTitle.textContent = video.title;
    console.log('[AR] klaar voor video', idx + 1, '/', VIDEOS.length, '—', video.src);
  }

  // ── AR.js dialogs verwijderen ────────────────────────────
  function killPermissionDialog() {
    const selectors = [
      '.a-dialog', '.a-dialog-allow-button', '.a-dialog-deny-button',
      '[class*="a-dialog"]', '[id*="a-dialog"]'
    ];
    selectors.forEach(sel => {
      document.querySelectorAll(sel).forEach(el => {
        el.style.display = 'none';
        el.style.visibility = 'hidden';
        el.style.pointerEvents = 'none';
        el.style.opacity = '0';
        if (el.parentNode) el.parentNode.removeChild(el);
      });
    });
    document.querySelectorAll('button').forEach(btn => {
      const t = btn.textContent.trim().toLowerCase();
      if (t === 'deny' || t === 'allow') {
        const parent = btn.closest('div[class*="dialog"], div[id*="dialog"]') || btn.parentNode;
        if (parent && parent !== document.body) {
          parent.style.display = 'none';
          if (parent.parentNode) parent.parentNode.removeChild(parent);
        }
      }
    });
  }

  const observer = new MutationObserver(() => killPermissionDialog());
  observer.observe(document.body, { childList: true, subtree: true });

  // ── Scène geladen ────────────────────────────────────────
  const scene = document.getElementById('ar-scene');
  scene.addEventListener('loaded', () => {
    killPermissionDialog();
    loadingScreen.style.display = 'none';
    prepareCurrentVideo();
    hud.classList.add('visible');
    markerHint.classList.add('visible');
  });
  setTimeout(() => {
    if (loadingScreen.style.display !== 'none') {
      loadingScreen.style.display = 'none';
      prepareCurrentVideo();
      hud.classList.add('visible');
      markerHint.classList.add('visible');
    }
  }, 8000);

  // ── Marker events ────────────────────────────────────────
  hiroMarker.addEventListener('markerFound', onMarkerFound);
  hiroMarker.addEventListener('markerLost',  onMarkerLost);

  function onMarkerFound() {
    if (markerLostTimer !== null) {
      clearTimeout(markerLostTimer);
      markerLostTimer = null;
    }
    markerHint.classList.remove('visible');
    btnNext.classList.remove('visible');

    if (videoStarted && !videoAsset.paused) {
      arVideoEl.setAttribute('visible', 'true');
    } else if (videoStarted && videoAsset.paused) {
      videoAsset.play()
        .then(() => arVideoEl.setAttribute('visible', 'true'))
        .catch(() => tapOverlay.classList.add('visible'));
    } else {
      tapOverlay.classList.add('visible');
    }
  }

  function onMarkerLost() {
    markerLostTimer = setTimeout(() => {
      markerLostTimer = null;
      tapOverlay.classList.remove('visible');
      if (!videoAsset.paused) videoAsset.pause();
      arVideoEl.setAttribute('visible', 'false');
      // Toon "Volgende video" knop alleen als video al afgespeeld was
      if (!videoStarted) markerHint.classList.add('visible');
    }, 1500);
  }

  // ── Video starten ────────────────────────────────────────
  async function startCurrentVideo() {
    tapOverlay.classList.remove('visible');
    try {
      videoAsset.muted = false;
      videoAsset.volume = 1.0;
      videoAsset.removeAttribute('muted');
      videoAsset.currentTime = 0;

      if (videoAsset.readyState < 2) {
        await new Promise((resolve, reject) => {
          const t = setTimeout(() => reject(new Error('timeout')), 10000);
          videoAsset.addEventListener('canplay', () => { clearTimeout(t); resolve(); }, { once: true });
          videoAsset.addEventListener('error',   () => { clearTimeout(t); reject(new Error('laad fout')); }, { once: true });
        });
      }

      await videoAsset.play();
      videoStarted = true;
      arVideoEl.setAttribute('visible', 'true');
      if (videoAsset.muted) soundBtn.style.display = 'block';

    } catch (err) {
      console.error('[AR] play fout:', err.message);
      tapOverlay.classList.add('visible');
    }
  }

  tapOverlay.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); startCurrentVideo(); }, { passive: false });
  tapOverlay.addEventListener('click', (e) => { e.stopPropagation(); startCurrentVideo(); });

  // ── Geluid knop ──────────────────────────────────────────
  function enableSound() {
    videoAsset.muted = false;
    videoAsset.volume = 1.0;
    videoAsset.removeAttribute('muted');
    videoAsset.play().catch(() => {});
    soundBtn.style.display = 'none';
  }
  soundBtn.addEventListener('touchstart', (e) => { e.preventDefault(); enableSound(); }, { passive: false });
  soundBtn.addEventListener('click', enableSound);

  // ── Video afgelopen → volgende klaarzetten ───────────────
  videoAsset.addEventListener('ended', () => {
    videoStarted = false;
    arVideoEl.setAttribute('visible', 'false');
    soundBtn.style.display = 'none';

    const nextIdx = getCurrentIndex() + 1;

    if (nextIdx < VIDEOS.length) {
      saveIndex(nextIdx);
      prepareCurrentVideo();
      // Toon subtiele "Volgende video" knop
      btnNext.classList.add('visible');
      markerHint.classList.remove('visible');
    } else {
      saveIndex(0);
      endScreen.classList.add('visible');
      hud.classList.remove('visible');
      markerHint.classList.remove('visible');
    }
  });

  // ── Volgende video knop ──────────────────────────────────
  function goNext() {
    btnNext.classList.remove('visible');
    markerHint.classList.add('visible');
  }
  btnNext.addEventListener('touchstart', (e) => { e.preventDefault(); goNext(); }, { passive: false });
  btnNext.addEventListener('click', goNext);

  // ── Reset (discreet, linksboven) ─────────────────────────
  function doReset() {
    resetIndex();
    endScreen.classList.remove('visible');
    btnNext.classList.remove('visible');
    prepareCurrentVideo();
    hud.classList.add('visible');
    markerHint.classList.add('visible');
  }
  btnReset.addEventListener('touchstart', (e) => { e.preventDefault(); doReset(); }, { passive: false });
  btnReset.addEventListener('click', doReset);
  btnHerstart.addEventListener('touchstart', (e) => { e.preventDefault(); doReset(); }, { passive: false });
  btnHerstart.addEventListener('click', doReset);

</script>
</body>
</html>
