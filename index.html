<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Activeer Ida's Wereld</title>

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    /* A-Frame canvas mag NOOIT touch events stelen */
    canvas { pointer-events: none !important; }
    a-scene { pointer-events: none !important; }

    /* ── AR.js permissievenster verbergen na toestemming ── */
    /* Het AR.js permission dialog heeft geen id, maar is herkenbaar
       aan de Deny/Allow knoppen met die exacte stijl */
    .a-dialog,
    .a-dialog-allow-button,
    .a-dialog-deny-button,
    .a-dialog-ok-button,
    [id*='permission'],
    [class*='permission'],
    [class*='dialog'] {
      /* Niet meteen verbergen — laat de gebruiker Allow tikken */
    }
    .arjs-permission-hidden {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      opacity: 0 !important;
    }

    /* ── LAADSCHERM ── */
    #loading-screen {
      position: fixed; inset: 0;
      background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999; gap: 20px; padding: 30px; text-align: center;
    }
    #loading-screen h1 { font-size: 2rem; font-weight: 700; letter-spacing: 0.1em; }
    #loading-screen p  { font-size: 0.95rem; color: #aaa; line-height: 1.6; max-width: 320px; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── VIDEOMENU ── */
    #video-menu {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.93);
      display: none; flex-direction: column;
      align-items: center; justify-content: flex-start;
      z-index: 8000; overflow-y: auto; padding: 24px 16px 40px;
      pointer-events: auto;
    }
    #video-menu.visible { display: flex; }
    #video-menu h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; text-align: center; }
    #video-menu p.subtitle { font-size: 0.85rem; color: #888; margin-bottom: 20px; text-align: center; }

    .video-btn {
      width: 100%; max-width: 420px;
      background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
      padding: 14px 18px; margin-bottom: 10px;
      cursor: pointer; text-align: left; color: #fff;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .video-btn:active { background: #2a2a2a; border-color: #666; }
    .video-btn .num {
      font-size: 0.72rem; color: #666; display: block;
      margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.08em;
    }
    .video-btn .title { font-size: 0.98rem; font-weight: 600; }

    /* ── HUD ── */
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      display: none; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
      z-index: 70000; pointer-events: auto;
    }
    #hud.visible { display: flex; }
    #hud-title {
      font-size: 0.85rem; font-weight: 600; max-width: 220px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #btn-change {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px; color: #fff; font-size: 0.8rem;
      padding: 6px 12px; cursor: pointer; white-space: nowrap;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* ── MARKER HINT ── */
    #marker-hint {
      position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.65); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 24px;
      padding: 10px 22px; font-size: 0.82rem; color: #ddd;
      white-space: nowrap; display: none;
      z-index: 70000; pointer-events: none;
    }
    #marker-hint.visible { display: block; }

    /* ── TAP OVERLAY — bedekt het VOLLEDIGE scherm voor iOS tap ──
       Dit is de oplossing: geen kleine knop die geblokkeerd wordt,
       maar een volledig transparant scherm dat elke tap registreert.
    ── */
    #tap-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      pointer-events: auto;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 80px;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      cursor: pointer;
    }
    #tap-overlay.visible { display: flex; }

    /* Visuele knop BINNEN de overlay — puur decoratief, de tap werkt op het hele scherm */
    #tap-label {
      background: rgba(255,255,255,0.97);
      color: #000;
      border-radius: 30px;
      padding: 16px 36px;
      font-size: 1.05rem;
      font-weight: 700;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      pointer-events: none; /* label zelf hoeft niet klikbaar te zijn */
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>

<!-- LAADSCHERM -->
<div id="loading-screen">
  <h1>IDA</h1>
  <div class="spinner"></div>
  <p>Activeer Ida's wereld.<br>Even geduld terwijl de AR-omgeving wordt geladen…</p>
</div>

<!-- VIDEOMENU -->
<div id="video-menu">
  <h2>Kies een beleving</h2>
  <p class="subtitle">Selecteer een video — richt daarna je camera op de HIRO-marker</p>

  <button class="video-btn" data-src="V1.mp4" data-title="Welkom">
    <span class="num">Intro</span><span class="title">Welkom</span>
  </button>
  <button class="video-btn" data-src="V2.mp4" data-title="Hoofd en hart">
    <span class="num">Hoofdstuk 2</span><span class="title">Hoofd en hart</span>
  </button>
  <button class="video-btn" data-src="V3.mp4" data-title="Het verschil tussen je hoofd en je hart">
    <span class="num">Hoofdstuk 3</span><span class="title">Het verschil tussen je hoofd en je hart</span>
  </button>
  <button class="video-btn" data-src="V4.mp4" data-title="Zielafspraken en doelen">
    <span class="num">Hoofdstuk 4</span><span class="title">Zielafspraken en doelen</span>
  </button>
  <button class="video-btn" data-src="V5.mp4" data-title="Zelfliefde en Goddelijke verbinding">
    <span class="num">Hoofdstuk 5</span><span class="title">Zelfliefde en Goddelijke verbinding</span>
  </button>
  <button class="video-btn" data-src="V6.mp4" data-title="Tussen twee werelden">
    <span class="num">Hoofdstuk 6</span><span class="title">Tussen twee werelden</span>
  </button>
  <button class="video-btn" data-src="V7.mp4" data-title="De prijs van de stilte">
    <span class="num">Hoofdstuk 7</span><span class="title">De prijs van de stilte</span>
  </button>
  <button class="video-btn" data-src="V8.mp4" data-title="Veerkracht">
    <span class="num">Hoofdstuk 8</span><span class="title">Veerkracht</span>
  </button>
  <button class="video-btn" data-src="V9.mp4" data-title="De kracht van vergeving">
    <span class="num">Hoofdstuk 9</span><span class="title">De kracht van vergeving</span>
  </button>
  <button class="video-btn" data-src="V10.mp4" data-title="Spirituele Symbolen">
    <span class="num">Hoofdstuk 10</span><span class="title">Spirituele Symbolen</span>
  </button>
  <button class="video-btn" data-src="Slotwoord.mp4" data-title="Slotwoord">
    <span class="num">Afsluiting</span><span class="title">Slotwoord</span>
  </button>
</div>

<!-- HUD -->
<div id="hud">
  <span id="hud-title">—</span>
  <button id="btn-change">Andere video</button>
</div>

<!-- MARKER HINT -->
<div id="marker-hint">Richt je camera op de HIRO-marker</div>

<!-- GELUID KNOP — verschijnt alleen als iOS geluid blokkeert -->
<button id="sound-btn" style="
  display: none;
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 99998;
  background: rgba(255,255,255,0.95);
  color: #000;
  border: none;
  border-radius: 30px;
  padding: 14px 30px;
  font-size: 1rem;
  font-weight: 700;
  pointer-events: auto;
  touch-action: manipulation;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
">Zet geluid aan</button>

<!-- TAP OVERLAY — volledig scherm, elke tap start de video -->
<div id="tap-overlay">
  <div id="tap-label">▶ Tik om video te starten</div>
</div>

<!-- VIDEO ELEMENT -->
<video
  id="ar-video-asset"
  preload="auto"
  playsinline
  webkit-playsinline
  muted
  crossorigin="anonymous"
  style="position:absolute; top:-9999px; left:-9999px; width:1px; height:1px;"
></video>

<!-- A-FRAME AR SCÈNE -->
<a-scene
  id="ar-scene"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
  renderer="logarithmicDepthBuffer: true; colorManagement: true;"
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false"
>
  <a-marker
    id="ida-marker"
    preset="hiro"
    smooth="true"
    smoothCount="10"
    smoothTolerance="0.01"
    smoothThreshold="5"
  >
    <a-video
      id="ar-video"
      width="1.0"
      height="1.78"
      position="0 0.8 0"
      rotation="-90 0 0"
      visible="false"
    ></a-video>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  const loadingScreen = document.getElementById('loading-screen');
  const videoMenu     = document.getElementById('video-menu');
  const hud           = document.getElementById('hud');
  const hudTitle      = document.getElementById('hud-title');
  const btnChange     = document.getElementById('btn-change');
  const markerHint    = document.getElementById('marker-hint');
  const tapOverlay    = document.getElementById('tap-overlay');
  const soundBtn      = document.getElementById('sound-btn');
  const videoAsset    = document.getElementById('ar-video-asset');
  const arVideoEl     = document.getElementById('ar-video');
  const idaMarker     = document.getElementById('ida-marker');
  const videoBtns     = document.querySelectorAll('.video-btn');

  let selectedSrc  = null;
  let videoStarted = false;

  // ── Video starten via tap op het volledige scherm ────────
  async function startSelectedVideo() {
    console.log('[AR] tap overlay activated');
    console.log('[AR] selectedSrc:', selectedSrc);
    console.log('[AR] video.src:', videoAsset.src);
    console.log('[AR] readyState:', videoAsset.readyState);
    console.log('[AR] networkState:', videoAsset.networkState);

    // Verberg overlay direct — geeft visuele feedback
    tapOverlay.classList.remove('visible');

    try {
      // Geluid AAN — gebruiker heeft al getikt (user gesture)
      videoAsset.muted = false;
      videoAsset.volume = 1.0;
      videoAsset.removeAttribute('muted');
      videoAsset.setAttribute('playsinline', '');
      videoAsset.setAttribute('webkit-playsinline', '');
      videoAsset.currentTime = 0;

      // Als video nog niet geladen: laad opnieuw
      if (videoAsset.readyState < 2) {
        console.log('[AR] video nog niet klaar (readyState=' + videoAsset.readyState + '), opnieuw laden');
        videoAsset.src = selectedSrc;
        videoAsset.load();
        // Wacht max 10 seconden op canplay
        await new Promise((resolve, reject) => {
          const t = setTimeout(() => reject(new Error('canplay timeout')), 10000);
          videoAsset.addEventListener('canplay', () => { clearTimeout(t); resolve(); }, { once: true });
          videoAsset.addEventListener('error',   () => { clearTimeout(t); reject(new Error('video load error: ' + (videoAsset.error ? videoAsset.error.code : 'unknown'))); }, { once: true });
        });
        console.log('[AR] canplay ontvangen');
      }

      await videoAsset.play();
      console.log('[AR] play() success');
      videoStarted = true;

      // Koppel als THREE.js VideoTexture
      const mesh = arVideoEl.getObject3D('mesh');
      if (mesh && mesh.material) {
        const tex = new THREE.VideoTexture(videoAsset);
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        tex.format    = THREE.RGBFormat;
        mesh.material.map = tex;
        mesh.material.needsUpdate = true;
        console.log('[AR] VideoTexture gekoppeld aan mesh');
      } else {
        console.warn('[AR] geen mesh gevonden, fallback src attribuut');
        arVideoEl.setAttribute('src', '#ar-video-asset');
      }

      arVideoEl.setAttribute('visible', 'true');

      // Als geluid toch geblokkeerd is door iOS, toon geluid-knop
      if (videoAsset.muted) {
        console.warn('[AR] geluid geblokkeerd door iOS, toon geluid-knop');
        soundBtn.style.display = 'block';
      }

    } catch (err) {
      console.error('[AR] play() fout:', err.name, err.message);
      tapOverlay.classList.add('visible');
      alert('Video fout: ' + err.name + '\n' + err.message + '\n\nSrc: ' + videoAsset.src + '\nReadyState: ' + videoAsset.readyState);
    }
  }

  // ── Tap overlay listeners — BEIDE voor maximale iOS compatibiliteit ──
  tapOverlay.addEventListener('touchstart', (e) => {
    e.preventDefault(); // voorkomt ghost click vertraging op iOS
    e.stopPropagation();
    startSelectedVideo();
  }, { passive: false });

  tapOverlay.addEventListener('click', (e) => {
    e.stopPropagation();
    startSelectedVideo();
  });

  // ── Geluid knop ──────────────────────────────────────────
  function enableSound() {
    videoAsset.muted = false;
    videoAsset.volume = 1.0;
    videoAsset.removeAttribute('muted');
    videoAsset.play().catch(err => console.warn('[AR] geluid herstart:', err));
    soundBtn.style.display = 'none';
    console.log('[AR] geluid aangezet');
  }
  soundBtn.addEventListener('touchstart', (e) => { e.preventDefault(); enableSound(); }, { passive: false });
  soundBtn.addEventListener('click', enableSound);

  // ── A-Frame scene geladen ────────────────────────────────
  document.querySelector('a-scene').addEventListener('loaded', () => {
    console.log('[AR] scene loaded');
    loadingScreen.style.display = 'none';
    showVideoMenu();
  });

  // Fallback na 5 seconden
  setTimeout(() => {
    if (loadingScreen.style.display !== 'none') {
      console.warn('[AR] fallback: laadscherm verborgen');
      loadingScreen.style.display = 'none';
      showVideoMenu();
    }
  }, 5000);

  // ── Video menu ───────────────────────────────────────────
  function showVideoMenu() {
    videoMenu.classList.add('visible');
    hud.classList.remove('visible');
    markerHint.classList.remove('visible');
    tapOverlay.classList.remove('visible');
    soundBtn.style.display = 'none';
    arVideoEl.setAttribute('visible', 'false');
    videoStarted = false;
    videoAsset.pause();
    videoAsset.removeAttribute('src');
    videoAsset.load();
  }

  // ── Video kiezen ─────────────────────────────────────────
  videoBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      selectedSrc = btn.dataset.src;
      console.log('[AR] video selected:', selectedSrc);

      videoAsset.pause();
      videoAsset.removeAttribute('src');
      videoAsset.load();
      arVideoEl.setAttribute('visible', 'false');
      videoStarted = false;

      // Alvast laden
      videoAsset.src = selectedSrc;
      videoAsset.muted = true;
      videoAsset.setAttribute('muted', '');
      videoAsset.setAttribute('playsinline', '');
      videoAsset.setAttribute('webkit-playsinline', '');
      videoAsset.setAttribute('preload', 'auto');
      videoAsset.load();

      videoAsset.addEventListener('loadeddata', () => console.log('[AR] loadeddata:', selectedSrc), { once: true });
      videoAsset.addEventListener('canplay',    () => console.log('[AR] canplay:', selectedSrc),    { once: true });
      videoAsset.addEventListener('error',      () => console.error('[AR] load error, code:', videoAsset.error && videoAsset.error.code), { once: true });

      hudTitle.textContent = btn.dataset.title;
      videoMenu.classList.remove('visible');
      hud.classList.add('visible');
      markerHint.classList.add('visible');
    });
  });

  // ── Andere video ─────────────────────────────────────────
  btnChange.addEventListener('click', showVideoMenu);

  // ── Marker gevonden ──────────────────────────────────────
  idaMarker.addEventListener('markerFound', () => {
    console.log('[AR] markerFound');
    markerHint.classList.remove('visible');
    if (!selectedSrc) return;

    if (videoStarted && !videoAsset.paused) {
      arVideoEl.setAttribute('visible', 'true');
    } else if (videoStarted && videoAsset.paused) {
      videoAsset.play()
        .then(() => { arVideoEl.setAttribute('visible', 'true'); console.log('[AR] resumed'); })
        .catch(err => { console.error('[AR] resume error:', err); tapOverlay.classList.add('visible'); });
    } else {
      // Nog niet gestart — toon tap overlay
      tapOverlay.classList.add('visible');
    }
  });

  // ── Marker verloren ──────────────────────────────────────
  idaMarker.addEventListener('markerLost', () => {
    console.log('[AR] markerLost');
    tapOverlay.classList.remove('visible');
    if (!videoAsset.paused) videoAsset.pause();
    arVideoEl.setAttribute('visible', 'false');
    if (selectedSrc) markerHint.classList.add('visible');
  });

  // ── AR.js permissievenster opruimen ────────────────────
  // AR.js injecteert een eigen dialog in de DOM met Deny/Allow knoppen.
  // Na Allow blijft dit venster soms hangen. We verwijderen het zodra
  // de camera stream actief is.
  function removeArjsPermissionDialog() {
    // Zoek op bekende AR.js class namen
    const selectors = [
      '.a-dialog',
      '.a-dialog-allow-button',
      '[class*="a-dialog"]',
      '[id*="a-dialog"]'
    ];
    selectors.forEach(sel => {
      document.querySelectorAll(sel).forEach(el => {
        // Verwijder de parent container van de knoppen
        const parent = el.closest('[style*="position"]') || el.parentElement;
        if (parent && parent !== document.body) {
          parent.style.display = 'none';
          parent.style.visibility = 'hidden';
          parent.style.pointerEvents = 'none';
          console.log('[AR] permissievenster verborgen:', parent);
        } else {
          el.style.display = 'none';
        }
      });
    });

    // Brute-force: zoek witte overlays met Deny/Allow knoppen
    document.querySelectorAll('button').forEach(btn => {
      const txt = btn.textContent.trim().toLowerCase();
      if (txt === 'deny' || txt === 'allow') {
        const dialog = btn.closest('div') || btn.parentElement;
        if (dialog) {
          dialog.style.display = 'none';
          dialog.style.visibility = 'hidden';
          dialog.style.pointerEvents = 'none';
          console.log('[AR] Deny/Allow dialog verborgen');
        }
        btn.style.display = 'none';
      }
    });
  }

  // Verwijder het venster zodra de camera stream start
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(() => {
      console.log('[AR] camera toegang verkregen, dialog opruimen');
      removeArjsPermissionDialog();
      // Herhaal na korte vertraging voor het geval AR.js het opnieuw injecteert
      setTimeout(removeArjsPermissionDialog, 500);
      setTimeout(removeArjsPermissionDialog, 1500);
    })
    .catch(err => console.warn('[AR] camera error:', err));

  // Observeer DOM-wijzigingen om het venster te verwijderen zodra het verschijnt
  const permObserver = new MutationObserver(() => {
    document.querySelectorAll('button').forEach(btn => {
      const txt = btn.textContent.trim().toLowerCase();
      if (txt === 'deny' || txt === 'allow') {
        // Wacht even zodat de gebruiker Allow kan tikken
        // Verberg het venster 1 seconde na verschijnen automatisch
        const dialog = btn.closest('div[style]') || btn.parentElement;
        if (dialog && !dialog.dataset.scheduled) {
          dialog.dataset.scheduled = '1';
          setTimeout(() => {
            dialog.style.display = 'none';
            dialog.style.visibility = 'hidden';
            dialog.style.pointerEvents = 'none';
            console.log('[AR] dialog auto-verborgen na 1s');
          }, 1000);
        }
      }
    });
  });
  permObserver.observe(document.body, { childList: true, subtree: true });

  // ── Video afgelopen ──────────────────────────────────────
  videoAsset.addEventListener('ended', () => {
    console.log('[AR] ended');
    videoStarted = false;
    arVideoEl.setAttribute('visible', 'false');
    markerHint.classList.add('visible');
  });
</script>

</body>
</html>
