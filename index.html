<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Activeer Ida's Wereld</title>

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    /* A-Frame canvas mag NOOIT touch/click events stelen van UI-elementen */
    canvas { pointer-events: none !important; }
    a-scene { pointer-events: none !important; }

    /* Laadscherm */
    #loading-screen {
      position: fixed; inset: 0;
      background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999; gap: 20px; padding: 30px; text-align: center;
    }
    #loading-screen h1 { font-size: 2rem; font-weight: 700; letter-spacing: 0.1em; }
    #loading-screen p  { font-size: 0.95rem; color: #aaa; line-height: 1.6; max-width: 320px; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Videomenu */
    #video-menu {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.92);
      display: none; flex-direction: column;
      align-items: center; justify-content: flex-start;
      z-index: 8000; overflow-y: auto; padding: 24px 16px 40px;
      pointer-events: auto;
    }
    #video-menu.visible { display: flex; }
    #video-menu h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; text-align: center; }
    #video-menu p.subtitle { font-size: 0.85rem; color: #888; margin-bottom: 20px; text-align: center; }

    .video-btn {
      width: 100%; max-width: 420px;
      background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
      padding: 14px 18px; margin-bottom: 10px;
      cursor: pointer; text-align: left;
      transition: background 0.2s, border-color 0.2s; color: #fff;
      pointer-events: auto;
    }
    .video-btn:hover, .video-btn:active { background: #2a2a2a; border-color: #666; }
    .video-btn .num {
      font-size: 0.72rem; color: #666; display: block;
      margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.08em;
    }
    .video-btn .title { font-size: 0.98rem; font-weight: 600; }

    /* AR scène */
    a-scene { position: fixed; inset: 0; }

    /* HUD */
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      display: none; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
      z-index: 70000; pointer-events: auto;
    }
    #hud.visible { display: flex; }
    #hud-title {
      font-size: 0.85rem; font-weight: 600; max-width: 220px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #btn-change {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px; color: #fff; font-size: 0.8rem;
      padding: 6px 12px; cursor: pointer; white-space: nowrap;
      pointer-events: auto;
    }

    /* Marker hint */
    #marker-hint {
      position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.65); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 24px;
      padding: 10px 22px; font-size: 0.82rem; color: #ddd;
      white-space: nowrap; display: none;
      z-index: 70000; pointer-events: none;
    }
    #marker-hint.visible { display: block; }

    /* ── START VIDEO KNOP — hoog z-index, altijd tapbaar ── */
    #start-video-button {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      pointer-events: auto;
      display: none;

      background: rgba(255,255,255,0.97);
      color: #000;
      border: none;
      border-radius: 30px;
      padding: 16px 36px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    #start-video-button.visible { display: block; }
    #start-video-button:active { background: rgba(200,200,200,0.97); }
  </style>
</head>
<body>

<!-- LAADSCHERM -->
<div id="loading-screen">
  <h1>IDA</h1>
  <div class="spinner"></div>
  <p>Activeer Ida's wereld.<br>Even geduld terwijl de AR-omgeving wordt geladen…</p>
</div>

<!-- VIDEOMENU -->
<div id="video-menu">
  <h2>Kies een beleving</h2>
  <p class="subtitle">Selecteer een video — richt daarna je camera op de HIRO-marker</p>

  <button class="video-btn" data-src="V1.mp4" data-title="Welkom">
    <span class="num">Intro</span><span class="title">Welkom</span>
  </button>
  <button class="video-btn" data-src="V2.mp4" data-title="Hoofd en hart">
    <span class="num">Hoofdstuk 2</span><span class="title">Hoofd en hart</span>
  </button>
  <button class="video-btn" data-src="V3.mp4" data-title="Het verschil tussen je hoofd en je hart">
    <span class="num">Hoofdstuk 3</span><span class="title">Het verschil tussen je hoofd en je hart</span>
  </button>
  <button class="video-btn" data-src="V4.mp4" data-title="Zielafspraken en doelen">
    <span class="num">Hoofdstuk 4</span><span class="title">Zielafspraken en doelen</span>
  </button>
  <button class="video-btn" data-src="V5.mp4" data-title="Zelfliefde en Goddelijke verbinding">
    <span class="num">Hoofdstuk 5</span><span class="title">Zelfliefde en Goddelijke verbinding</span>
  </button>
  <button class="video-btn" data-src="V6.mp4" data-title="Tussen twee werelden">
    <span class="num">Hoofdstuk 6</span><span class="title">Tussen twee werelden</span>
  </button>
  <button class="video-btn" data-src="V7.mp4" data-title="De prijs van de stilte">
    <span class="num">Hoofdstuk 7</span><span class="title">De prijs van de stilte</span>
  </button>
  <button class="video-btn" data-src="V8.mp4" data-title="Veerkracht">
    <span class="num">Hoofdstuk 8</span><span class="title">Veerkracht</span>
  </button>
  <button class="video-btn" data-src="V9.mp4" data-title="De kracht van vergeving">
    <span class="num">Hoofdstuk 9</span><span class="title">De kracht van vergeving</span>
  </button>
  <button class="video-btn" data-src="V10.mp4" data-title="Spirituele Symbolen">
    <span class="num">Hoofdstuk 10</span><span class="title">Spirituele Symbolen</span>
  </button>
  <button class="video-btn" data-src="Slotwoord.mp4" data-title="Slotwoord">
    <span class="num">Afsluiting</span><span class="title">Slotwoord</span>
  </button>
</div>

<!-- HUD -->
<div id="hud">
  <span id="hud-title">—</span>
  <button id="btn-change">Andere video</button>
</div>

<!-- MARKER HINT -->
<div id="marker-hint">Richt je camera op de HIRO-marker</div>

<!-- START VIDEO KNOP — buiten a-scene, hoog z-index, altijd tapbaar -->
<button id="start-video-button">▶ Tik om video te starten</button>

<!-- VIDEO ELEMENT — buiten a-assets, direct in body voor iOS -->
<video
  id="ar-video-asset"
  preload="auto"
  playsinline
  webkit-playsinline
  muted
  loop="false"
  crossorigin="anonymous"
  style="position:absolute; top:-9999px; left:-9999px; width:1px; height:1px;"
></video>

<!-- A-FRAME AR SCÈNE -->
<a-scene
  id="ar-scene"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
  renderer="logarithmicDepthBuffer: true; colorManagement: true;"
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false"
>
  <!-- HIRO-marker -->
  <a-marker
    id="ida-marker"
    preset="hiro"
    smooth="true"
    smoothCount="10"
    smoothTolerance="0.01"
    smoothThreshold="5"
  >
    <!-- Video-vlak: standaard onzichtbaar -->
    <a-video
      id="ar-video"
      width="1.8"
      height="1.0"
      position="0 0.6 0"
      rotation="-90 0 0"
      visible="false"
    ></a-video>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  // ── DOM ──────────────────────────────────────────────────
  const loadingScreen    = document.getElementById('loading-screen');
  const videoMenu        = document.getElementById('video-menu');
  const hud              = document.getElementById('hud');
  const hudTitle         = document.getElementById('hud-title');
  const btnChange        = document.getElementById('btn-change');
  const markerHint       = document.getElementById('marker-hint');
  const startVideoButton = document.getElementById('start-video-button');
  const videoAsset       = document.getElementById('ar-video-asset');
  const arVideoEl        = document.getElementById('ar-video');
  const idaMarker        = document.getElementById('ida-marker');
  const videoBtns        = document.querySelectorAll('.video-btn');

  let selectedSrc  = null;
  let videoStarted = false;

  // ── Video starten — kernfunctie ──────────────────────────
  async function startSelectedVideo() {
    console.log('[AR] play button clicked');
    try {
      videoAsset.muted = true;
      videoAsset.playsInline = true;
      videoAsset.setAttribute('playsinline', '');
      videoAsset.setAttribute('webkit-playsinline', '');
      videoAsset.currentTime = 0;

      await videoAsset.play();
      console.log('[AR] video play success');

      videoStarted = true;
      startVideoButton.classList.remove('visible');

      // Koppel video als texture aan het AR-vlak
      arVideoEl.setAttribute('src', '#ar-video-asset');
      arVideoEl.setAttribute('visible', 'true');

    } catch (err) {
      console.error('[AR] video play error:', err);
      alert('De video kon niet starten. Tik nogmaals of herlaad de pagina.');
    }
  }

  // ── Startknop: click EN touchend voor maximale iOS compatibiliteit ──
  startVideoButton.addEventListener('click', async (e) => {
    e.stopPropagation();
    await startSelectedVideo();
  });

  startVideoButton.addEventListener('touchend', async (e) => {
    e.preventDefault();
    e.stopPropagation();
    await startSelectedVideo();
  });

  // ── A-Frame geladen ──────────────────────────────────────
  document.querySelector('a-scene').addEventListener('loaded', () => {
    console.log('[AR] scene loaded');

    // Registreer direct THREE.js VideoTexture component
    AFRAME.registerComponent('video-texture-direct', {
      init: function () {
        const vid = document.getElementById('ar-video-asset');
        if (!vid) return;
        const texture = new THREE.VideoTexture(vid);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.format = THREE.RGBFormat;
        const mesh = this.el.getObject3D('mesh');
        if (mesh) {
          mesh.material.map = texture;
          mesh.material.needsUpdate = true;
          console.log('[AR] video-texture-direct gekoppeld');
        }
      }
    });

    arVideoEl.setAttribute('video-texture-direct', '');

    loadingScreen.style.display = 'none';
    showVideoMenu();
  });

  setTimeout(() => {
    if (loadingScreen.style.display !== 'none') {
      console.warn('[AR] fallback: laadscherm verborgen');
      loadingScreen.style.display = 'none';
      showVideoMenu();
    }
  }, 5000);

  // ── Video menu ───────────────────────────────────────────
  function showVideoMenu() {
    videoMenu.classList.add('visible');
    hud.classList.remove('visible');
    markerHint.classList.remove('visible');
    startVideoButton.classList.remove('visible');
    arVideoEl.setAttribute('visible', 'false');
    videoStarted = false;
    videoAsset.pause();
    videoAsset.removeAttribute('src');
    videoAsset.load();
  }

  // ── Video kiezen ─────────────────────────────────────────
  videoBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      selectedSrc = btn.dataset.src;
      console.log('[AR] video selected:', selectedSrc);

      videoAsset.pause();
      videoAsset.removeAttribute('src');
      videoAsset.load();
      arVideoEl.setAttribute('visible', 'false');
      videoStarted = false;

      videoAsset.muted = true;
      videoAsset.src = selectedSrc;
      videoAsset.load();

      videoAsset.addEventListener('loadeddata', () => {
        console.log('[AR] video loadeddata:', selectedSrc);
      }, { once: true });

      videoAsset.addEventListener('canplay', () => {
        console.log('[AR] video canplay:', selectedSrc);
      }, { once: true });

      videoAsset.addEventListener('error', () => {
        console.error('[AR] video load error:', videoAsset.error);
      }, { once: true });

      hudTitle.textContent = btn.dataset.title;
      videoMenu.classList.remove('visible');
      hud.classList.add('visible');
      markerHint.classList.add('visible');
    });
  });

  // ── Andere video ─────────────────────────────────────────
  btnChange.addEventListener('click', showVideoMenu);

  // ── Marker gevonden ──────────────────────────────────────
  idaMarker.addEventListener('markerFound', () => {
    console.log('[AR] marker found');
    markerHint.classList.remove('visible');

    if (!selectedSrc) return;

    if (videoStarted && !videoAsset.paused) {
      arVideoEl.setAttribute('visible', 'true');
    } else if (videoStarted && videoAsset.paused) {
      videoAsset.play()
        .then(() => {
          arVideoEl.setAttribute('visible', 'true');
          console.log('[AR] video resumed');
        })
        .catch(err => console.error('[AR] resume error:', err));
    } else {
      startVideoButton.classList.add('visible');
    }
  });

  // ── Marker verloren ──────────────────────────────────────
  idaMarker.addEventListener('markerLost', () => {
    console.log('[AR] marker lost');
    startVideoButton.classList.remove('visible');

    if (!videoAsset.paused) videoAsset.pause();
    arVideoEl.setAttribute('visible', 'false');

    if (selectedSrc) markerHint.classList.add('visible');
  });

  // ── Video afgelopen ──────────────────────────────────────
  videoAsset.addEventListener('ended', () => {
    console.log('[AR] video ended');
    videoStarted = false;
    arVideoEl.setAttribute('visible', 'false');
    markerHint.classList.add('visible');
  });
</script>

</body>
</html>
