<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Activeer Ida's Wereld</title>

  <!-- A-Frame & AR.js worden pas geladen NA camera-toestemming -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    /* A-Frame canvas mag NOOIT touch events stelen */
    canvas { pointer-events: none !important; }
    a-scene { pointer-events: none !important; }

    /* ── STAP 1: CAMERA TOESTEMMING SCHERM ── */
    #permission-screen {
      position: fixed; inset: 0;
      background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 99999; gap: 24px; padding: 40px; text-align: center;
    }
    #permission-screen h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: 0.05em; }
    #permission-screen p  { font-size: 0.95rem; color: #aaa; line-height: 1.7; max-width: 300px; }
    #btn-allow-camera {
      background: #fff; color: #000;
      border: none; border-radius: 30px;
      padding: 16px 40px; font-size: 1.05rem; font-weight: 700;
      cursor: pointer; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 20px rgba(255,255,255,0.2);
    }
    #btn-allow-camera:active { background: #ddd; }
    #permission-error {
      color: #ff6b6b; font-size: 0.85rem;
      display: none; max-width: 280px; line-height: 1.5;
    }

    /* ── STAP 2: LAADSCHERM ── */
    #loading-screen {
      position: fixed; inset: 0;
      background: #000;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999; gap: 20px; padding: 30px; text-align: center;
    }
    #loading-screen.visible { display: flex; }
    #loading-screen h1 { font-size: 2rem; font-weight: 700; letter-spacing: 0.1em; }
    #loading-screen p  { font-size: 0.95rem; color: #aaa; line-height: 1.6; max-width: 320px; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── VIDEOMENU ── */
    #video-menu {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.93);
      display: none; flex-direction: column;
      align-items: center; justify-content: flex-start;
      z-index: 8000; overflow-y: auto; padding: 24px 16px 40px;
      pointer-events: auto;
    }
    #video-menu.visible { display: flex; }
    #video-menu h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; text-align: center; }
    #video-menu p.subtitle { font-size: 0.85rem; color: #888; margin-bottom: 20px; text-align: center; }

    .video-btn {
      width: 100%; max-width: 420px;
      background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
      padding: 14px 18px; margin-bottom: 10px;
      cursor: pointer; text-align: left; color: #fff;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .video-btn:active { background: #2a2a2a; border-color: #666; }
    .video-btn .num {
      font-size: 0.72rem; color: #666; display: block;
      margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.08em;
    }
    .video-btn .title { font-size: 0.98rem; font-weight: 600; }

    /* ── HUD ── */
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      display: none; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
      z-index: 70000; pointer-events: auto;
    }
    #hud.visible { display: flex; }
    #hud-title {
      font-size: 0.85rem; font-weight: 600; max-width: 220px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #btn-change {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px; color: #fff; font-size: 0.8rem;
      padding: 6px 12px; cursor: pointer; white-space: nowrap;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* ── MARKER HINT ── */
    #marker-hint {
      position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.65); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 24px;
      padding: 10px 22px; font-size: 0.82rem; color: #ddd;
      white-space: nowrap; display: none;
      z-index: 70000; pointer-events: none;
    }
    #marker-hint.visible { display: block; }

    /* ── TAP OVERLAY — volledig scherm ── */
    #tap-overlay {
      position: fixed; inset: 0;
      z-index: 99998;
      pointer-events: auto;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 80px;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      cursor: pointer;
    }
    #tap-overlay.visible { display: flex; }
    #tap-label {
      background: rgba(255,255,255,0.97);
      color: #000;
      border-radius: 30px;
      padding: 16px 36px;
      font-size: 1.05rem;
      font-weight: 700;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── GELUID KNOP ── */
    #sound-btn {
      display: none;
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99997;
      background: rgba(255,255,255,0.95);
      color: #000;
      border: none;
      border-radius: 30px;
      padding: 14px 30px;
      font-size: 1rem;
      font-weight: 700;
      pointer-events: auto;
      touch-action: manipulation;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      white-space: nowrap;
    }
  </style>
</head>
<body>

<!-- STAP 1: CAMERA TOESTEMMING (eigen scherm, geen AR.js dialog) -->
<div id="permission-screen">
  <h1>IDA</h1>
  <p>Om de AR-beleving te starten heeft deze pagina toegang tot je camera nodig.</p>
  <button id="btn-allow-camera">Camera inschakelen</button>
  <p id="permission-error"></p>
</div>

<!-- STAP 2: LAADSCHERM (zichtbaar terwijl AR.js laadt) -->
<div id="loading-screen">
  <h1>IDA</h1>
  <div class="spinner"></div>
  <p>Activeer Ida's wereld.<br>Even geduld…</p>
</div>

<!-- VIDEOMENU -->
<div id="video-menu">
  <h2>Kies een beleving</h2>
  <p class="subtitle">Selecteer een video — richt daarna je camera op de HIRO-marker</p>

  <button class="video-btn" data-src="V1.mp4" data-title="Welkom">
    <span class="num">Intro</span><span class="title">Welkom</span>
  </button>
  <button class="video-btn" data-src="V2.mp4" data-title="Hoofd en hart">
    <span class="num">Hoofdstuk 2</span><span class="title">Hoofd en hart</span>
  </button>
  <button class="video-btn" data-src="V3.mp4" data-title="Het verschil tussen je hoofd en je hart">
    <span class="num">Hoofdstuk 3</span><span class="title">Het verschil tussen je hoofd en je hart</span>
  </button>
  <button class="video-btn" data-src="V4.mp4" data-title="Zielafspraken en doelen">
    <span class="num">Hoofdstuk 4</span><span class="title">Zielafspraken en doelen</span>
  </button>
  <button class="video-btn" data-src="V5.mp4" data-title="Zelfliefde en Goddelijke verbinding">
    <span class="num">Hoofdstuk 5</span><span class="title">Zelfliefde en Goddelijke verbinding</span>
  </button>
  <button class="video-btn" data-src="V6.mp4" data-title="Tussen twee werelden">
    <span class="num">Hoofdstuk 6</span><span class="title">Tussen twee werelden</span>
  </button>
  <button class="video-btn" data-src="V7.mp4" data-title="De prijs van de stilte">
    <span class="num">Hoofdstuk 7</span><span class="title">De prijs van de stilte</span>
  </button>
  <button class="video-btn" data-src="V8.mp4" data-title="Veerkracht">
    <span class="num">Hoofdstuk 8</span><span class="title">Veerkracht</span>
  </button>
  <button class="video-btn" data-src="V9.mp4" data-title="De kracht van vergeving">
    <span class="num">Hoofdstuk 9</span><span class="title">De kracht van vergeving</span>
  </button>
  <button class="video-btn" data-src="V10.mp4" data-title="Spirituele Symbolen">
    <span class="num">Hoofdstuk 10</span><span class="title">Spirituele Symbolen</span>
  </button>
  <button class="video-btn" data-src="Slotwoord.mp4" data-title="Slotwoord">
    <span class="num">Afsluiting</span><span class="title">Slotwoord</span>
  </button>
</div>

<!-- HUD -->
<div id="hud">
  <span id="hud-title">—</span>
  <button id="btn-change">Andere video</button>
</div>

<!-- MARKER HINT -->
<div id="marker-hint">Richt je camera op de HIRO-marker</div>

<!-- TAP OVERLAY -->
<div id="tap-overlay">
  <div id="tap-label">▶ Tik om video te starten</div>
</div>

<!-- GELUID KNOP -->
<button id="sound-btn">🔊 Zet geluid aan</button>

<!-- VIDEO ELEMENT -->
<video
  id="ar-video-asset"
  preload="auto"
  playsinline
  webkit-playsinline
  crossorigin="anonymous"
  style="position:absolute; top:-9999px; left:-9999px; width:1px; height:1px;"
></video>

<!-- A-FRAME CONTAINER (wordt gevuld via JavaScript NA camera-toestemming) -->
<div id="ar-container"></div>

<script>
  // ── DOM referenties ──────────────────────────────────────
  const permissionScreen = document.getElementById('permission-screen');
  const btnAllowCamera   = document.getElementById('btn-allow-camera');
  const permissionError  = document.getElementById('permission-error');
  const loadingScreen    = document.getElementById('loading-screen');
  const videoMenu        = document.getElementById('video-menu');
  const hud              = document.getElementById('hud');
  const hudTitle         = document.getElementById('hud-title');
  const btnChange        = document.getElementById('btn-change');
  const markerHint       = document.getElementById('marker-hint');
  const tapOverlay       = document.getElementById('tap-overlay');
  const soundBtn         = document.getElementById('sound-btn');
  const videoAsset       = document.getElementById('ar-video-asset');
  const arContainer      = document.getElementById('ar-container');
  const videoBtns        = document.querySelectorAll('.video-btn');

  let selectedSrc  = null;
  let videoStarted = false;
  let arVideoEl    = null;
  let idaMarker    = null;
  let arSceneReady = false;

  // ── STAP 1: Camera toestemming vragen via eigen knop ────
  // Door getUserMedia ZELF aan te roepen binnen een user gesture,
  // krijgt de browser de toestemming en toont AR.js GEEN eigen dialog meer.
  function requestCameraPermission() {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => {
        console.log('[AR] camera toestemming verkregen');
        // Stop de stream meteen — AR.js start zijn eigen stream
        stream.getTracks().forEach(t => t.stop());
        // Verberg permissie scherm, toon laadscherm
        permissionScreen.style.display = 'none';
        loadingScreen.classList.add('visible');
        // Laad nu pas A-Frame en AR.js
        loadArScripts();
      })
      .catch(err => {
        console.error('[AR] camera geweigerd:', err);
        permissionError.style.display = 'block';
        permissionError.textContent = 'Camera toegang geweigerd. Ga naar Instellingen > Safari > Camera en sta toegang toe, dan herlaad de pagina.';
      });
  }

  btnAllowCamera.addEventListener('touchstart', (e) => {
    e.preventDefault();
    requestCameraPermission();
  }, { passive: false });
  btnAllowCamera.addEventListener('click', requestCameraPermission);

  // ── STAP 2: A-Frame en AR.js dynamisch laden ─────────────
  function loadArScripts() {
    const aframeScript = document.createElement('script');
    aframeScript.src = 'https://aframe.io/releases/1.4.0/aframe.min.js';
    aframeScript.onload = () => {
      console.log('[AR] A-Frame geladen');
      const arjsScript = document.createElement('script');
      arjsScript.src = 'https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js';
      arjsScript.onload = () => {
        console.log('[AR] AR.js geladen');
        buildArScene();
      };
      document.head.appendChild(arjsScript);
    };
    document.head.appendChild(aframeScript);
  }

  // ── STAP 3: A-Frame scène bouwen in de DOM ───────────────
  function buildArScene() {
    arContainer.innerHTML = `
      <a-scene
        id="ar-scene"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        renderer="logarithmicDepthBuffer: true; colorManagement: true;"
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false"
      >
        <a-marker
          id="ida-marker"
          preset="hiro"
          smooth="true"
          smoothCount="10"
          smoothTolerance="0.01"
          smoothThreshold="5"
        >
          <a-video
            id="ar-video"
            width="1.0"
            height="1.78"
            position="0 0.8 0"
            rotation="-90 0 0"
            visible="false"
          ></a-video>
        </a-marker>
        <a-entity camera></a-entity>
      </a-scene>
    `;

    // Wacht tot de scène klaar is
    const scene = document.getElementById('ar-scene');
    scene.addEventListener('loaded', onSceneLoaded);
    // Fallback na 6 seconden
    setTimeout(() => { if (!arSceneReady) onSceneLoaded(); }, 6000);
  }

  // ── STAP 4: Scène geladen → videomenu tonen ──────────────
  function onSceneLoaded() {
    if (arSceneReady) return;
    arSceneReady = true;
    console.log('[AR] scene loaded');

    arVideoEl  = document.getElementById('ar-video');
    idaMarker  = document.getElementById('ida-marker');

    loadingScreen.classList.remove('visible');
    showVideoMenu();

    // Marker events koppelen
    idaMarker.addEventListener('markerFound', onMarkerFound);
    idaMarker.addEventListener('markerLost',  onMarkerLost);
  }

  // ── Video menu ───────────────────────────────────────────
  function showVideoMenu() {
    videoMenu.classList.add('visible');
    hud.classList.remove('visible');
    markerHint.classList.remove('visible');
    tapOverlay.classList.remove('visible');
    soundBtn.style.display = 'none';
    if (arVideoEl) arVideoEl.setAttribute('visible', 'false');
    videoStarted = false;
    videoAsset.pause();
    videoAsset.removeAttribute('src');
    videoAsset.load();
  }

  // ── Video kiezen ─────────────────────────────────────────
  videoBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      selectedSrc = btn.dataset.src;
      console.log('[AR] video selected:', selectedSrc);

      videoAsset.pause();
      videoAsset.removeAttribute('src');
      videoAsset.load();
      if (arVideoEl) arVideoEl.setAttribute('visible', 'false');
      videoStarted = false;
      soundBtn.style.display = 'none';

      // Alvast laden
      videoAsset.src = selectedSrc;
      videoAsset.setAttribute('playsinline', '');
      videoAsset.setAttribute('webkit-playsinline', '');
      videoAsset.setAttribute('preload', 'auto');
      videoAsset.load();

      videoAsset.addEventListener('loadeddata', () => console.log('[AR] loadeddata:', selectedSrc), { once: true });
      videoAsset.addEventListener('canplay',    () => console.log('[AR] canplay:', selectedSrc),    { once: true });
      videoAsset.addEventListener('error',      () => console.error('[AR] load error, code:', videoAsset.error && videoAsset.error.code), { once: true });

      hudTitle.textContent = btn.dataset.title;
      videoMenu.classList.remove('visible');
      hud.classList.add('visible');
      markerHint.classList.add('visible');
    });
  });

  // ── Andere video ─────────────────────────────────────────
  btnChange.addEventListener('click', showVideoMenu);

  // ── Video starten ────────────────────────────────────────
  async function startSelectedVideo() {
    if (!selectedSrc) return;
    console.log('[AR] start video:', selectedSrc);
    tapOverlay.classList.remove('visible');

    try {
      // Geluid AAN — we zitten in een user gesture
      videoAsset.muted = false;
      videoAsset.volume = 1.0;
      videoAsset.removeAttribute('muted');
      videoAsset.setAttribute('playsinline', '');
      videoAsset.setAttribute('webkit-playsinline', '');
      videoAsset.currentTime = 0;

      // Wacht op canplay als video nog niet klaar is
      if (videoAsset.readyState < 2) {
        console.log('[AR] wacht op canplay, readyState:', videoAsset.readyState);
        videoAsset.src = selectedSrc;
        videoAsset.load();
        await new Promise((resolve, reject) => {
          const t = setTimeout(() => reject(new Error('canplay timeout na 10s')), 10000);
          videoAsset.addEventListener('canplay', () => { clearTimeout(t); resolve(); }, { once: true });
          videoAsset.addEventListener('error',   () => { clearTimeout(t); reject(new Error('video laad fout, code: ' + (videoAsset.error ? videoAsset.error.code : '?'))); }, { once: true });
        });
      }

      console.log('[AR] readyState voor play:', videoAsset.readyState);
      await videoAsset.play();
      console.log('[AR] play() success, muted:', videoAsset.muted);
      videoStarted = true;

      // Koppel als THREE.js VideoTexture
      if (arVideoEl) {
        const mesh = arVideoEl.getObject3D('mesh');
        if (mesh && mesh.material) {
          const tex = new THREE.VideoTexture(videoAsset);
          tex.minFilter = THREE.LinearFilter;
          tex.magFilter = THREE.LinearFilter;
          tex.format    = THREE.RGBFormat;
          mesh.material.map = tex;
          mesh.material.needsUpdate = true;
          console.log('[AR] VideoTexture gekoppeld');
        } else {
          console.warn('[AR] geen mesh, fallback src');
          arVideoEl.setAttribute('src', '#ar-video-asset');
        }
        arVideoEl.setAttribute('visible', 'true');
      }

      // Controleer of geluid echt aan is
      if (videoAsset.muted) {
        console.warn('[AR] geluid nog steeds muted na play()');
        soundBtn.style.display = 'block';
      }

    } catch (err) {
      console.error('[AR] play() fout:', err.name, '-', err.message);
      tapOverlay.classList.add('visible');
      alert('Video kon niet starten:\n' + err.name + ': ' + err.message + '\n\nBestand: ' + selectedSrc + '\nReadyState: ' + videoAsset.readyState);
    }
  }

  // ── Tap overlay listeners ────────────────────────────────
  tapOverlay.addEventListener('touchstart', (e) => {
    e.preventDefault();
    e.stopPropagation();
    startSelectedVideo();
  }, { passive: false });

  tapOverlay.addEventListener('click', (e) => {
    e.stopPropagation();
    startSelectedVideo();
  });

  // ── Geluid knop ──────────────────────────────────────────
  function enableSound() {
    videoAsset.muted = false;
    videoAsset.volume = 1.0;
    videoAsset.removeAttribute('muted');
    videoAsset.play().catch(err => console.warn('[AR] geluid herstart fout:', err));
    soundBtn.style.display = 'none';
    console.log('[AR] geluid aangezet via knop');
  }
  soundBtn.addEventListener('touchstart', (e) => { e.preventDefault(); enableSound(); }, { passive: false });
  soundBtn.addEventListener('click', enableSound);

  // ── Marker gevonden ──────────────────────────────────────
  function onMarkerFound() {
    console.log('[AR] markerFound');
    markerHint.classList.remove('visible');
    if (!selectedSrc) return;

    if (videoStarted && !videoAsset.paused) {
      if (arVideoEl) arVideoEl.setAttribute('visible', 'true');
    } else if (videoStarted && videoAsset.paused) {
      videoAsset.play()
        .then(() => {
          if (arVideoEl) arVideoEl.setAttribute('visible', 'true');
          console.log('[AR] video hervat');
        })
        .catch(err => {
          console.error('[AR] hervatten fout:', err);
          tapOverlay.classList.add('visible');
        });
    } else {
      tapOverlay.classList.add('visible');
    }
  }

  // ── Marker verloren ──────────────────────────────────────
  function onMarkerLost() {
    console.log('[AR] markerLost');
    tapOverlay.classList.remove('visible');
    if (!videoAsset.paused) videoAsset.pause();
    if (arVideoEl) arVideoEl.setAttribute('visible', 'false');
    if (selectedSrc) markerHint.classList.add('visible');
  }

  // ── Video afgelopen ──────────────────────────────────────
  videoAsset.addEventListener('ended', () => {
    console.log('[AR] video ended');
    videoStarted = false;
    if (arVideoEl) arVideoEl.setAttribute('visible', 'false');
    if (selectedSrc) markerHint.classList.add('visible');
  });
</script>

</body>
</html>
