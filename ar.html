<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wat je schaduw je wil vertellen – AR</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: Georgia, serif; }

    a-scene {
      position: fixed !important;
      top: 0; left: 0;
      width: 100vw !important;
      height: 100vh !important;
    }

    #hint {
      position: fixed;
      bottom: 40px;
      left: 0; right: 0;
      text-align: center;
      color: #c8a96e;
      font-size: 0.7rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      z-index: 100;
      opacity: 0.8;
      pointer-events: none;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 1s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }

    .loading-title {
      color: #c8a96e;
      font-size: 1rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-align: center;
      padding: 0 32px;
      margin-bottom: 8px;
    }
    .loading-sub {
      color: #c8a96e;
      font-size: 0.65rem;
      letter-spacing: 3px;
      opacity: 0.5;
      margin-bottom: 40px;
    }
    #loading-hint {
      color: #c8a96e;
      font-size: 0.6rem;
      letter-spacing: 2px;
      opacity: 0.5;
      text-align: center;
      padding: 0 20px;
    }

    /* Fullscreen video overlay */
    #video-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 500;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #video-overlay.active {
      display: flex;
    }
    #fullscreen-video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
    #close-btn {
      position: fixed;
      top: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      background: rgba(0,0,0,0.6);
      border: 1px solid #c8a96e88;
      border-radius: 50%;
      color: #c8a96e;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 600;
    }
    #video-chapter {
      position: fixed;
      bottom: 32px;
      left: 0; right: 0;
      text-align: center;
      color: #c8a96e;
      font-size: 0.65rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      z-index: 600;
      opacity: 0.7;
    }


  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="loading-title">Wat je schaduw je wil vertellen</div>
    <div class="loading-sub">Words of Wholeness</div>
    <div id="loading-hint">Camera wordt gestart&hellip;</div>
  </div>

  <div id="hint">Richt de camera op een pagina in het boek</div>

  <!-- Fullscreen video overlay -->
  <div id="video-overlay">
    <video id="fullscreen-video" playsinline webkit-playsinline></video>
    <div id="close-btn">✕</div>
    <div id="video-chapter"></div>
  </div>

  <!-- AR Scene (alleen voor marker detectie) -->
  <a-scene
    mindar-image="imageTargetSrc: assets/targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true; antialias: false"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0"><a-plane width="1" height="1" opacity="0" material="transparent: true"></a-plane></a-entity>
    <a-entity mindar-image-target="targetIndex: 1"><a-plane width="1" height="1" opacity="0" material="transparent: true"></a-plane></a-entity>
    <a-entity mindar-image-target="targetIndex: 2"><a-plane width="1" height="1" opacity="0" material="transparent: true"></a-plane></a-entity>
    <a-entity mindar-image-target="targetIndex: 3"><a-plane width="1" height="1" opacity="0" material="transparent: true"></a-plane></a-entity>
    <a-entity mindar-image-target="targetIndex: 4"><a-plane width="1" height="1" opacity="0" material="transparent: true"></a-plane></a-entity>
    <a-entity mindar-image-target="targetIndex: 5"><a-plane width="1" height="1" opacity="0" material="transparent: true"></a-plane></a-entity>
    <a-entity mindar-image-target="targetIndex: 6"><a-plane width="1" height="1" opacity="0" material="transparent: true"></a-plane></a-entity>
    <a-entity mindar-image-target="targetIndex: 7"><a-plane width="1" height="1" opacity="0" material="transparent: true"></a-plane></a-entity>
    <a-entity mindar-image-target="targetIndex: 8"><a-plane width="1" height="1" opacity="0" material="transparent: true"></a-plane></a-entity>
    <a-entity mindar-image-target="targetIndex: 9"><a-plane width="1" height="1" opacity="0" material="transparent: true"></a-plane></a-entity>
    <a-entity mindar-image-target="targetIndex: 10"><a-plane width="1" height="1" opacity="0" material="transparent: true"></a-plane></a-entity>
    <a-entity mindar-image-target="targetIndex: 11"><a-plane width="1" height="1" opacity="0" material="transparent: true"></a-plane></a-entity>
  </a-scene>

  <script>
    const labels = [
      'Intro',
      'Hoofdstuk I', 'Hoofdstuk II', 'Hoofdstuk III', 'Hoofdstuk IV',
      'Hoofdstuk V', 'Hoofdstuk VI', 'Hoofdstuk VII', 'Hoofdstuk VIII',
      'Hoofdstuk IX', 'Hoofdstuk X', 'Slotwoord'
    ];

    const videoSrc = [
      'intro.mp4', 'V1.mp4', 'V2.mp4', 'V3.mp4', 'V4.mp4', 'V5.mp4',
      'V6.mp4', 'V7.mp4', 'V8.mp4', 'V9.mp4', 'V10.mp4', 'Slotwoord.mp4'
    ];

    const debugEl     = document.getElementById('debug');
    const hint        = document.getElementById('hint');
    const loading     = document.getElementById('loading-screen');
    const loadHint    = document.getElementById('loading-hint');
    const overlay     = document.getElementById('video-overlay');
    const fsVideo     = document.getElementById('fullscreen-video');
    const closeBtn    = document.getElementById('close-btn');
    const videoChapter = document.getElementById('video-chapter');


    function hideLoading() {
      loading.classList.add('hidden');
    }

    function playFullscreen(index) {
      fsVideo.src = videoSrc[index];
      fsVideo.load();
      overlay.classList.add('active');
      videoChapter.textContent = labels[index];
      fsVideo.play().catch(() => {
        // iOS fallback: wacht op tap
        fsVideo.addEventListener('click', () => fsVideo.play(), { once: true });
      });
    }

    function stopFullscreen() {
      fsVideo.pause();
      fsVideo.src = '';
      overlay.classList.remove('active');
    }

    closeBtn.addEventListener('click', stopFullscreen);

    // Camera toestemming
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then(stream => {
        stream.getTracks().forEach(t => t.stop());
          loadHint.textContent = 'AR wordt geladen\u2026';
      })
      .catch(err => {
          loadHint.textContent = 'Cameratoegang geweigerd';
      });

    const sceneEl = document.querySelector('a-scene');
    sceneEl.addEventListener('arReady', () => { log('arReady'); hideLoading(); });
    sceneEl.addEventListener('arError', (e) => { log('arError: ' + JSON.stringify(e.detail)); });
    sceneEl.addEventListener('loaded', () => { log('scene loaded'); });
    setTimeout(() => { if (!loading.classList.contains('hidden')) { log('timeout'); hideLoading(); }}, 8000);

    // Marker detectie: alleen triggeren als overlay niet al open is
    for (let i = 0; i < 12; i++) {
      const target = document.querySelector(`[mindar-image-target="targetIndex: ${i}"]`);

      target.addEventListener('targetFound', () => {
          if (!overlay.classList.contains('active')) {
          playFullscreen(i);
        }
      });
    }
  </script>

</body>
</html>
