<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wat je schaduw je wil vertellen – AR</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: Georgia, serif; }

    #container {
      position: fixed;
      inset: 0;
    }

    #camera-feed {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    #ar-video {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      max-width: 400px;
      display: none;
      z-index: 50;
      border-radius: 4px;
    }

    #hint {
      position: fixed;
      bottom: 40px;
      left: 0; right: 0;
      text-align: center;
      color: #c8a96e;
      font-size: 0.7rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      z-index: 100;
      opacity: 0.8;
    }

    #chapter-label {
      position: fixed;
      top: 24px;
      left: 0; right: 0;
      text-align: center;
      color: #c8a96e;
      font-size: 0.7rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #chapter-label.visible { opacity: 0.9; }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 1s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }

    .loading-title {
      color: #c8a96e;
      font-size: 1rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-align: center;
      padding: 0 32px;
      margin-bottom: 8px;
    }
    .loading-sub {
      color: #c8a96e;
      font-size: 0.65rem;
      letter-spacing: 3px;
      opacity: 0.5;
      margin-bottom: 40px;
    }
    .loading-hint {
      color: #c8a96e;
      font-size: 0.6rem;
      letter-spacing: 2px;
      opacity: 0.4;
      text-align: center;
      padding: 0 20px;
    }

    #debug {
      position: fixed;
      top: 60px;
      left: 10px; right: 10px;
      background: rgba(0,0,0,0.85);
      color: #c8a96e;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      z-index: 9998;
      max-height: 160px;
      overflow-y: auto;
      border: 1px solid #c8a96e44;
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="loading-title">Wat je schaduw je wil vertellen</div>
    <div class="loading-sub">Words of Wholeness</div>
    <div class="loading-hint" id="loading-hint">Camera wordt gestart&hellip;</div>
  </div>

  <div id="debug"></div>
  <div id="container"></div>
  <video id="ar-video" playsinline webkit-playsinline loop></video>
  <div id="chapter-label"></div>
  <div id="hint">Richt de camera op een pagina in het boek</div>

  <script>
    const labels = [
      'Intro',
      'Hoofdstuk I', 'Hoofdstuk II', 'Hoofdstuk III', 'Hoofdstuk IV',
      'Hoofdstuk V', 'Hoofdstuk VI', 'Hoofdstuk VII', 'Hoofdstuk VIII',
      'Hoofdstuk IX', 'Hoofdstuk X', 'Slotwoord'
    ];

    const videos = [
      'intro.mp4', 'V1.mp4', 'V2.mp4', 'V3.mp4', 'V4.mp4', 'V5.mp4',
      'V6.mp4', 'V7.mp4', 'V8.mp4', 'V9.mp4', 'V10.mp4', 'Slotwoord.mp4'
    ];

    const debugEl = document.getElementById('debug');
    const loadingScreen = document.getElementById('loading-screen');
    const loadingHint = document.getElementById('loading-hint');
    const arVideo = document.getElementById('ar-video');
    const chapterLabel = document.getElementById('chapter-label');

    function log(msg) {
      const line = document.createElement('div');
      line.textContent = new Date().toLocaleTimeString() + ' ' + msg;
      debugEl.appendChild(line);
      debugEl.scrollTop = debugEl.scrollHeight;
    }

    window.onerror = (msg, src, line) => log('JS FOUT: ' + msg);

    async function start() {
      try {
        log('Camera toestemming vragen...');
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }, audio: false
        });
        stream.getTracks().forEach(t => t.stop());
        log('Camera OK, MindAR laden...');
        loadingHint.textContent = 'AR wordt geladen\u2026';
      } catch(e) {
        log('Camera FOUT: ' + e.message);
        loadingHint.textContent = 'Cameratoegang geweigerd. Controleer instellingen.';
        return;
      }

      try {
        const mindarController = new MINDAR.IMAGE.MindARThree({
          container: document.getElementById('container'),
          imageTargetSrc: 'assets/targets.mind',
          uiLoading: 'no',
          uiScanning: 'no',
          uiError: 'no',
        });

        const { renderer, scene, camera } = mindarController;
        log('MindAR object aangemaakt');

        await mindarController.start();
        log('MindAR gestart, camera zichtbaar');
        loadingScreen.classList.add('hidden');

        for (let i = 0; i < 12; i++) {
          const anchor = mindarController.addAnchor(i);

          anchor.onTargetFound = () => {
            log('Marker ' + i + ' gevonden: ' + labels[i]);
            arVideo.src = videos[i];
            arVideo.style.display = 'block';
            arVideo.play();
            chapterLabel.textContent = labels[i];
            chapterLabel.classList.add('visible');
          };

          anchor.onTargetLost = () => {
            log('Marker ' + i + ' verloren');
            arVideo.pause();
            arVideo.style.display = 'none';
            chapterLabel.classList.remove('visible');
          };
        }

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

      } catch(e) {
        log('MindAR FOUT: ' + e.message);
        loadingHint.textContent = 'AR fout: ' + e.message;
      }
    }

    start();
  </script>
</body>
</html>
