<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wat je schaduw je wil vertellen – AR</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: Georgia, serif; }

    a-scene {
      position: fixed !important;
      top: 0; left: 0;
      width: 100vw !important;
      height: 100vh !important;
    }

    #hint {
      position: fixed;
      bottom: 40px;
      left: 0; right: 0;
      text-align: center;
      color: #c8a96e;
      font-size: 0.7rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      z-index: 100;
      opacity: 0.8;
      pointer-events: none;
    }

    #chapter-label {
      position: fixed;
      top: 24px;
      left: 0; right: 0;
      text-align: center;
      color: #c8a96e;
      font-size: 0.7rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }
    #chapter-label.visible { opacity: 0.9; }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 1s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }

    .loading-title {
      color: #c8a96e;
      font-size: 1rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-align: center;
      padding: 0 32px;
      margin-bottom: 8px;
    }
    .loading-sub {
      color: #c8a96e;
      font-size: 0.65rem;
      letter-spacing: 3px;
      opacity: 0.5;
      margin-bottom: 40px;
    }
    #loading-hint {
      color: #c8a96e;
      font-size: 0.6rem;
      letter-spacing: 2px;
      opacity: 0.5;
      text-align: center;
      padding: 0 20px;
    }

    #debug {
      position: fixed;
      top: 60px;
      left: 10px; right: 10px;
      background: rgba(0,0,0,0.85);
      color: #c8a96e;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      z-index: 9998;
      max-height: 160px;
      overflow-y: auto;
      border: 1px solid #c8a96e44;
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="loading-title">Wat je schaduw je wil vertellen</div>
    <div class="loading-sub">Words of Wholeness</div>
    <div id="loading-hint">Camera wordt gestart&hellip;</div>
  </div>

  <div id="tap-btn" style="
    display: none;
    position: fixed;
    inset: 0;
    align-items: center;
    justify-content: center;
    z-index: 200;
  ">
    <button style="
      background: #c8a96e;
      color: #0a0a0a;
      border: none;
      padding: 16px 40px;
      font-family: Georgia, serif;
      font-size: 1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 2px;
      cursor: pointer;
    ">Tik om te starten</button>
  </div>

  <div id="debug"></div>
  <div id="chapter-label"></div>
  <div id="hint">Richt de camera op een pagina in het boek</div>

  <a-scene
    mindar-image="imageTargetSrc: assets/targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true; antialias: false"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="vid0"  src="intro.mp4"     preload="none" playsinline webkit-playsinline loop crossorigin="anonymous"></video>
      <video id="vid1"  src="V1.mp4"        preload="none" playsinline webkit-playsinline loop crossorigin="anonymous"></video>
      <video id="vid2"  src="V2.mp4"        preload="none" playsinline webkit-playsinline loop crossorigin="anonymous"></video>
      <video id="vid3"  src="V3.mp4"        preload="none" playsinline webkit-playsinline loop crossorigin="anonymous"></video>
      <video id="vid4"  src="V4.mp4"        preload="none" playsinline webkit-playsinline loop crossorigin="anonymous"></video>
      <video id="vid5"  src="V5.mp4"        preload="none" playsinline webkit-playsinline loop crossorigin="anonymous"></video>
      <video id="vid6"  src="V6.mp4"        preload="none" playsinline webkit-playsinline loop crossorigin="anonymous"></video>
      <video id="vid7"  src="V7.mp4"        preload="none" playsinline webkit-playsinline loop crossorigin="anonymous"></video>
      <video id="vid8"  src="V8.mp4"        preload="none" playsinline webkit-playsinline loop crossorigin="anonymous"></video>
      <video id="vid9"  src="V9.mp4"        preload="none" playsinline webkit-playsinline loop crossorigin="anonymous"></video>
      <video id="vid10" src="V10.mp4"       preload="none" playsinline webkit-playsinline loop crossorigin="anonymous"></video>
      <video id="vid11" src="Slotwoord.mp4" preload="none" playsinline webkit-playsinline loop crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video src="#vid0" position="0 0 0" width="1" height="0.552"></a-video>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 1">
      <a-video src="#vid1" position="0 0 0" width="1" height="0.552"></a-video>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 2">
      <a-video src="#vid2" position="0 0 0" width="1" height="0.552"></a-video>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 3">
      <a-video src="#vid3" position="0 0 0" width="1" height="0.552"></a-video>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 4">
      <a-video src="#vid4" position="0 0 0" width="1" height="0.552"></a-video>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 5">
      <a-video src="#vid5" position="0 0 0" width="1" height="0.552"></a-video>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 6">
      <a-video src="#vid6" position="0 0 0" width="1" height="0.552"></a-video>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 7">
      <a-video src="#vid7" position="0 0 0" width="1" height="0.552"></a-video>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 8">
      <a-video src="#vid8" position="0 0 0" width="1" height="0.552"></a-video>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 9">
      <a-video src="#vid9" position="0 0 0" width="1" height="0.552"></a-video>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 10">
      <a-video src="#vid10" position="0 0 0" width="1" height="0.552"></a-video>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 11">
      <a-video src="#vid11" position="0 0 0" width="1" height="0.552"></a-video>
    </a-entity>

  </a-scene>

  <script>
    const labels = [
      'Intro',
      'Hoofdstuk I', 'Hoofdstuk II', 'Hoofdstuk III', 'Hoofdstuk IV',
      'Hoofdstuk V', 'Hoofdstuk VI', 'Hoofdstuk VII', 'Hoofdstuk VIII',
      'Hoofdstuk IX', 'Hoofdstuk X', 'Slotwoord'
    ];

    const tapBtn   = document.getElementById('tap-btn');
    const debugEl  = document.getElementById('debug');
    const hint     = document.getElementById('hint');
    const label    = document.getElementById('chapter-label');
    const loading  = document.getElementById('loading-screen');
    const loadHint = document.getElementById('loading-hint');

    function log(msg) {
      const d = document.createElement('div');
      d.textContent = new Date().toLocaleTimeString() + ' ' + msg;
      debugEl.appendChild(d);
      debugEl.scrollTop = debugEl.scrollHeight;
    }

    window.onerror = (msg, src, line) => log('FOUT: ' + msg);

    function hideLoading() {
      loading.classList.add('hidden');
      log('Laadscherm verborgen');
    }

    // Camera toestemming eerst
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then(stream => {
        stream.getTracks().forEach(t => t.stop());
        log('Camera toestemming OK');
        loadHint.textContent = 'AR wordt geladen\u2026';
      })
      .catch(err => {
        log('Camera FOUT: ' + err.message);
        loadHint.textContent = 'Cameratoegang geweigerd';
      });

    const sceneEl = document.querySelector('a-scene');
    sceneEl.addEventListener('arReady', () => { log('arReady'); hideLoading(); });
    sceneEl.addEventListener('arError', (e) => { log('arError: ' + JSON.stringify(e.detail)); });
    sceneEl.addEventListener('loaded',  () => { log('scene loaded'); });
    setTimeout(() => { if (!loading.classList.contains('hidden')) { log('timeout fallback'); hideLoading(); }}, 8000);

    for (let i = 0; i < 12; i++) {
      const target = document.querySelector(`[mindar-image-target="targetIndex: ${i}"]`);
      const video  = document.getElementById(`vid${i}`);

      target.addEventListener('targetFound', () => {
        log('Marker ' + i + ' gevonden');
        hint.style.opacity = '0';
        label.textContent = labels[i];
        label.classList.add('visible');
        // iOS vereist gebruikersinteractie voor autoplay met geluid
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            // Autoplay geblokkeerd, toon tapknop
            tapBtn.style.display = 'flex';
            tapBtn.onclick = () => {
              video.play();
              tapBtn.style.display = 'none';
            };
          });
        }
      });

      target.addEventListener('targetLost', () => {
        video.pause();
        video.currentTime = 0;
        hint.style.opacity = '0.8';
        label.classList.remove('visible');
      });
    }
  </script>

</body>
</html>
